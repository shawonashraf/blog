<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Noto+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

    <!--
      Runs before the body paints so a stored preference never flashes the
      wrong theme. No stored choice means the CSS media query decides.
    -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('theme');
                if (saved === 'dark' || saved === 'light') {
                    document.documentElement.setAttribute('data-theme', saved);
                }
            } catch (e) { /* private mode: fall back to the OS preference */ }
        })();
    </script>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
            <nav class="site-nav">
                <a href="{{ '/' | relative_url }}">Home</a>
                <a href="https://shawonashraf.github.io">About</a>
                <button class="theme-toggle" type="button" aria-label="Switch between light and dark theme">
                    <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                         stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                    <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                         stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="5"/>
                        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                    </svg>
                </button>
            </nav>
        </div>
    </header>

    <main class="page-content" aria-label="Content">
        <div class="container">
            {{ content }}
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; {{ site.time | date: '%Y' }} {{ site.author }}. All rights reserved.</p>
        </div>
    </footer>

    <!-- KaTeX JS and Auto-render -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05" crossorigin="anonymous"
        onload="renderMathInElement(document.body, {
            delimiters: [
                {left: '$$', right: '$$', display: true},
                {left: '\\[', right: '\\]', display: true},
                {left: '$', right: '$', display: false},
                {left: '\\(', right: '\\)', display: false}
            ],
            throwOnError: false
        });"></script>

    <!-- Theme toggle -->
    <script>
        (function () {
            var root = document.documentElement;

            // Charts read their colours from the stylesheet, so they follow the
            // theme without hardcoding a second palette here.
            window.plotlyThemeLayout = function () {
                var s = getComputedStyle(root);
                return {
                    paper_bgcolor: s.getPropertyValue('--bg-color').trim(),
                    plot_bgcolor: s.getPropertyValue('--bg-color').trim(),
                    font: { color: s.getPropertyValue('--text-color').trim() }
                };
            };

            function currentTheme() {
                return root.getAttribute('data-theme')
                    || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            }

            function repaintCharts() {
                if (typeof Plotly === 'undefined') return;
                var theme = window.plotlyThemeLayout();
                document.querySelectorAll('.plotly-graph-wrapper').forEach(function (el) {
                    Plotly.relayout(el, {
                        paper_bgcolor: theme.paper_bgcolor,
                        plot_bgcolor: theme.plot_bgcolor,
                        'font.color': theme.font.color
                    });
                });
            }

            document.querySelector('.theme-toggle').addEventListener('click', function () {
                var next = currentTheme() === 'dark' ? 'light' : 'dark';
                root.setAttribute('data-theme', next);
                try { localStorage.setItem('theme', next); } catch (e) { /* private mode */ }
                repaintCharts();
            });
        })();
    </script>

    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var plotlyBlocks = document.querySelectorAll('.language-plotly');
            plotlyBlocks.forEach(function(block, index) {
                if (block.tagName === 'CODE' && block.closest('div.language-plotly')) {
                    return;
                }
                var jsonString = block.textContent;
                try {
                    var plotlyData = JSON.parse(jsonString);
                    var newDiv = document.createElement('div');
                    newDiv.id = 'plotly-plot-' + index;
                    newDiv.className = 'plotly-graph-wrapper';
                    
                    var wrapper = block.closest('.highlighter-rouge') || block;
                    wrapper.parentNode.insertBefore(newDiv, wrapper);
                    wrapper.remove();
                    
                    var layout = Object.assign({}, plotlyData.layout, window.plotlyThemeLayout());
                    Plotly.newPlot(newDiv.id, plotlyData.data, layout, plotlyData.config);
                } catch (e) {
                    console.error("Error parsing Plotly JSON: ", e);
                }
            });
        });
    </script>
</body>
</html>
